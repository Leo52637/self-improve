<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Self Improve</title>
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#10141c">
<style>
:root{--bg:#10141c;--card:#1a2030;--tx:#e8ecf3;--mu:#8a94a8;--ac:#5eead4;--bd:#2a3347}
@media(prefers-color-scheme:light){:root{--bg:#f4f6fa;--card:#fff;--tx:#161b26;--mu:#5d667a;--ac:#0d9488;--bd:#dde2ec}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px system-ui,sans-serif;padding:0 16px 84px;max-width:560px;margin:auto}
h1{font-size:22px;margin:20px 0 4px}h2{font-size:15px;color:var(--mu);margin:20px 0 8px;font-weight:600}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px 14px;margin:8px 0}
label.row{display:flex;gap:12px;align-items:center;cursor:pointer}
input[type=checkbox]{width:22px;height:22px;accent-color:var(--ac)}
input,select,textarea,button{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:9px;width:100%;margin:4px 0}
button{background:var(--ac);color:#06201c;border:0;font-weight:600;cursor:pointer}button.ghost{background:none;color:var(--mu);border:1px solid var(--bd)}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chips label{padding:6px 10px;border:1px solid var(--bd);border-radius:20px;cursor:pointer;font-size:14px}
.chips input{display:none}.chips input:checked+span{color:var(--ac);font-weight:700}
.mu{color:var(--mu);font-size:14px}.bar{height:6px;background:var(--bd);border-radius:3px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--ac)}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--bd);display:flex;justify-content:center}
nav button{background:none;color:var(--mu);border:0;border-radius:0;width:auto;flex:1;max-width:112px;margin:0;padding:14px 4px;font-size:13px}nav button.on{color:var(--ac)}
</style></head><body>
<div id="app"></div>
<nav id="nav"></nav>
<script>
const DAYS=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
let S;try{S=JSON.parse(localStorage.getItem('si'))}catch(e){}
S=S||{areas:['Body','Mind','Skills'],goals:[],done:{},checkins:{},reminder:{on:false,time:'20:00',last:''}};
const save=()=>localStorage.setItem('si',JSON.stringify(S));
const key=d=>new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
const wd=d=>(d.getDay()+6)%7;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let tab='today';const $=s=>document.querySelector(s);
const bar=p=>`<div class="bar"><i style="width:${Math.round(p*100)}%"></i></div>`;
const scheduled=d=>S.goals.filter(g=>g.days.includes(wd(d)));
const isDone=(d,id)=>!!(S.done[key(d)]||{})[id];

const views={
today(){
  const t=new Date(),k=key(t),list=scheduled(t),n=list.filter(g=>isDone(t,g.id)).length,c=S.checkins[k]||{};
  return `<h1>Today</h1><div class="mu">${t.toDateString()}</div>
  ${list.length?bar(n/list.length):''}
  ${list.map(g=>`<div class="card"><label class="row"><input type="checkbox" ${isDone(t,g.id)?'checked':''} onchange="tog('${g.id}')">
  <span>${esc(g.name)}<br><span class="mu">${esc(g.area)}${g.why?' · '+esc(g.why):''}</span></span></label></div>`).join('')
  ||'<div class="card mu">Nothing scheduled today. Add goals in the Goals tab.</div>'}
  <h2>Evening check-in</h2><div class="card">
  Mood <b id="mv">${c.mood||5}</b>/10<input type="range" min="1" max="10" value="${c.mood||5}" id="mood" oninput="mv.textContent=this.value">
  Energy <b id="ev">${c.energy||5}</b>/10<input type="range" min="1" max="10" value="${c.energy||5}" id="energy" oninput="ev.textContent=this.value">
  <input id="win" placeholder="One win today" value="${esc(c.win)}"><input id="fix" placeholder="One thing to fix" value="${esc(c.fix)}">
  <button onclick="checkin()">${c.mood?'Update':'Save'} check-in</button></div>`},
week(){
  const t=new Date(),mon=new Date(t);mon.setDate(t.getDate()-wd(t));
  return `<h1>This week</h1>`+DAYS.map((_,i)=>{
    const d=new Date(mon);d.setDate(mon.getDate()+i);const l=scheduled(d),n=l.filter(g=>isDone(d,g.id)).length;
    return `<div class="card" ${i==wd(t)?'style="border-color:var(--ac)"':''}><b>${DAYS[i]}</b> <span class="mu">${l.length?n+'/'+l.length:'rest'}</span>${l.length?bar(n/l.length):''}
    <div class="mu">${l.map(g=>(isDone(d,g.id)?'✓ ':'· ')+esc(g.name)).join('<br>')}</div></div>`}).join('')},
goals(){
  return `<h1>Goals</h1>`+(S.goals.map(g=>`<div class="card"><b>${esc(g.name)}</b> <span class="mu">${esc(g.area)}</span><br>
  <span class="mu">${g.days.map(i=>DAYS[i]).join(' ')}${g.why?' · '+esc(g.why):''}</span>
  <button class="ghost" onclick="del('${g.id}')">Delete</button></div>`).join('')||'<div class="card mu">No goals yet.</div>')+
  `<h2>Add a goal</h2><div class="card"><input id="gn" placeholder="Action, e.g. Run 20 min">
  <select id="ga">${S.areas.map(a=>`<option>${esc(a)}</option>`).join('')}</select>
  <input id="gw" placeholder="Why it matters (optional)">
  <div class="chips">${DAYS.map((d,i)=>`<label><input type="checkbox" value="${i}" class="gd"><span>${d}</span></label>`).join('')}</div>
  <button onclick="addGoal()">Add goal</button></div>`},
settings(){
  const r=S.reminder;
  return `<h1>Settings</h1><h2>Areas</h2><div class="card">
  ${S.areas.map(a=>`<div class="row" style="display:flex;justify-content:space-between">${esc(a)}<a onclick="delArea('${esc(a)}')" class="mu">remove</a></div>`).join('')}
  <input id="na" placeholder="New area, e.g. Money"><button onclick="addArea()">Add area</button></div>
  <h2>Daily reminder</h2><div class="card"><label class="row"><input type="checkbox" ${r.on?'checked':''} onchange="remind(this.checked)">Remind me daily</label>
  <input type="time" value="${r.time}" onchange="S.reminder.time=this.value;save()">
  <div class="mu">Fires only while the app is open or running in the background; a closed phone app may miss it.</div></div>`}};

function render(){
  $('#app').innerHTML=views[tab]();
  $('#nav').innerHTML=[['today','Today'],['week','Week'],['goals','Goals'],['settings','Settings']]
    .map(([k,l])=>`<button class="${k==tab?'on':''}" onclick="tab='${k}';render()">${l}</button>`).join('')}
function tog(id){const k=key(new Date());(S.done[k]=S.done[k]||{})[id]=!S.done[k][id];save();render()}
function checkin(){S.checkins[key(new Date())]={mood:+mood.value,energy:+energy.value,win:win.value,fix:fix.value};save();render()}
function addGoal(){const name=gn.value.trim(),days=[...document.querySelectorAll('.gd:checked')].map(e=>+e.value);
  if(!name||!days.length)return alert('Give it a name and pick at least one day.');
  S.goals.push({id:Date.now().toString(36),name,area:ga.value,why:gw.value.trim(),days});save();render()}
function del(id){if(confirm('Delete this goal?')){S.goals=S.goals.filter(g=>g.id!=id);save();render()}}
function addArea(){const a=na.value.trim();if(a&&!S.areas.includes(a)){S.areas.push(a);save();render()}}
function delArea(a){if(S.goals.some(g=>g.area==a))return alert('Move or delete that area\'s goals first.');S.areas=S.areas.filter(x=>x!=a);save();render()}
async function remind(on){if(on&&await Notification.requestPermission()!='granted'){alert('Notifications are blocked in your browser.');on=false}S.reminder.on=on;save();render()}
setInterval(()=>{const r=S.reminder,n=new Date(),k=key(n);
  if(r.on&&r.last!=k&&n.toTimeString().slice(0,5)>=r.time){r.last=k;save();
    navigator.serviceWorker.ready.then(s=>s.showNotification('Self Improve',{body:'Time for your check-in.'}))}},30000);
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
render();
</script></body></html>
