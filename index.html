const bar=p=>`<div class="bar"><i style="width:${Math.round(p*100)}%"></i></div>`,pl=n=>n==1?'day':'days',
  tile=(l,v,u)=>`<div class="card tile"><div class="mu">${l}</div><b>${v}</b><span class="mu">${u}</span></div>`;

  'para pero como cómo dónde cuándo está entonces puede hace nadie pues todavía todavia esos esas esta este esto estos estas sobre entre cuando donde porque todo todos toda todas mucho mucha muchos muchas poco poca algo nada tambien también desde hasta hacer hice hizo tengo tiene tener tuve estoy estar estaba estuve había habia hemos sido siempre nunca '+
  'otra otro otros otras ahora antes después despues luego bien solo sólo cada mismo misma aunque mientras según contra durante ellos ellas nosotros usted ustedes quiero puedo pude mañana manana ayer cosa cosas menos mejor demasiado bastante están estan eran eres somos será sera aquí aqui allí alli').split(' '));
const WDS=['Mondays','Tuesdays','Wednesdays','Thursdays','Fridays','Saturdays','Sundays'];
function insights(now){
  const out=[],add=(score,text,detail)=>out.push({text,detail,score}),gte=(x,t)=>x>t-1e-9,

    `After a low-energy evening (${TH.lowE} or less) you get ${p(lo.a/lo.b)} of the next day's goals done, vs ${p(hi.a/hi.b)} after a high-energy one (${TH.hiE}+).`,`Based on ${lo.n} days after low energy and ${hi.n} after high, last 60 days.`);

    if(pts.length<TH.valN||!pts[0][1])return;const[t0,v0]=pts[0],[t1,v1]=pts[pts.length-1],ch=(v1-v0)/Math.abs(v0)*100;
    const mx=avg(pts.map(x=>x[0])),my=avg(pts.map(x=>x[1])),sl=7*pts.reduce((s,[x,y])=>s+(x-mx)*(y-my),0)/pts.reduce((s,[x])=>s+(x-mx)**2,0),sp=t1-t0,
      dp=Math.max(...[v0,v1].map(v=>(String(rnd(v)).split('.')[1]||'').length));

// monthly review: the 28 full days ending yesterday vs the 28 before; due 28 days after the last review, or (none yet) once an active goal is 28 days old

  :['lower','Lower or drop',`Done ${p}% of ${b} scheduled days: make it much smaller, or drop it.`];
function rev(now){const day=i=>{const d=new Date(now);d.setDate(now.getDate()-i);return d},av=a=>a.length?Math.round(a.reduce((s,x)=>s+x,0)/a.length*10)/10:null,
  per=o=>{let a=0,b=0,ci=0;const m=[],e=[];for(let i=o+1;i<=o+28;i++){const d=day(i),l=scheduled(d),c=S.checkins[key(d)];b+=l.length;a+=l.filter(g=>isDone(d,g.id)).length;
    if(c){ci++;if(+c.mood>0)m.push(+c.mood);if(+c.energy>0)e.push(+c.energy)}}return{pct:b?Math.round(a/b*100):null,ci,mood:av(m),energy:av(e)}};
  return{at:+now,from:key(day(28)),to:key(day(1)),lab:md(day(28))+' – '+md(day(1)),c:per(0),p:per(28),best:streak(d=>dayOk(d),28,day(1)).best,ins:insights(now).slice(0,3),worked:'',didnt:'',focus:'',
    g:S.goals.filter(g=>!g.off).map(g=>{let a=0,b=0;const v=[];for(let i=28;i;i--){const d=day(i),r=dayOk(d,g.id),x=S.values[key(d)]?.[g.id];if(r!=null){b++;a+=r}if(typeof x=='number'&&isFinite(x))v.push(x)}
      const p=b?Math.round(a/b*100):0,s=sug(p,b);return{g,p,b,v,s,a:s[0],name:g.name,days:[...g.days]}})}}
const lb=(l,h)=>`<label><span class="mu">${l}</span>${h}</label>`;
const dch=(a,p)=>`<div class="chips">${DAYS.map((d,j)=>`<label><input type="checkbox" ${a.includes(j)?'checked':''} onchange="tgd(${p},${j})"><span>${d}</span></label>`).join('')}</div>`;
const START=`<button onclick="R=null;tab='review';render();window.scrollTo(0,0)">Start review</button>`; // window.: a bare scrollTo in a handler is the button's own

const views={
today(){
  // Today is the launch screen: a bug in insights must never blank it
  const t=new Date(),k=key(t),list=scheduled(t),n=list.filter(g=>isDone(t,g.id)).length,c=S.checkins[k]||{},top=(()=>{try{return insights(t)[0]}catch(e){}})();
  return `<h1>Today</h1><div class="mu">${t.toDateString()}</div>${S.focus?`<div class="mu">This month's focus: ${esc(S.focus)}</div>`:''}
  ${due(t)?`<div class="card"><b>Your monthly review is ready</b><div class="mu">Look back at the last 4 weeks and adjust your goals.</div>${START}</div>`:''}
  ${top?`<div class="card ins" style="font-size:14px">${esc(top.text)} <a href="#" onclick="tab='progress';render();return false">See all insights</a></div>`:''}
  ${list.length?bar(n/list.length):''}
  ${list.map(g=>`<div class="card" style="display:flex;gap:8px;align-items:center"><label class="row" style="flex:1"><input type="checkbox" ${isDone(t,g.id)?'checked':''} onchange="tog('${g.id}')">
  <span>${esc(g.name)}<br><span class="mu">${esc(g.area)}${g.unit?' · '+esc(g.unit):''}${g.why?' · '+esc(g.why):''}</span></span></label>
  ${g.unit?`<input type="number" step="any" inputmode="decimal" style="width:84px;margin:0" placeholder="${esc(g.unit)}" aria-label="${esc(g.name)}, today's value (${esc(g.unit)})" value="${(S.values[k]||{})[g.id]??''}" onchange="logv('${g.id}',this)">`:''}</div>`).join('')
  ||'<div class="card mu">Nothing scheduled today. Add goals in the Goals tab.</div>'}
  <h2>Evening check-in</h2><div class="card">
  Mood <b id="mv">${c.mood||5}</b>/10<input type="range" min="1" max="10" value="${c.mood||5}" id="mood" oninput="mv.textContent=this.value">
  Energy <b id="ev">${c.energy||5}</b>/10<input type="range" min="1" max="10" value="${c.energy||5}" id="energy" oninput="ev.textContent=this.value">
  <input id="win" placeholder="One win today" value="${esc(c.win)}"><input id="fix" placeholder="One thing to fix" value="${esc(c.fix)}">
  <button onclick="checkin()">${c.mood?'Update':'Save'} check-in</button></div>`},
week(){
  const t=new Date(),mon=new Date(t);mon.setDate(t.getDate()-wd(t));
  return `<h1>This week</h1>`+DAYS.map((_,i)=>{
    const d=new Date(mon);d.setDate(mon.getDate()+i);const l=scheduled(d),n=l.filter(g=>isDone(d,g.id)).length;
    return `<div class="card" ${i==wd(t)?'style="border-color:var(--ac)"':''}><b>${DAYS[i]}</b> <span class="mu">${l.length?n+'/'+l.length:'rest'}</span>${l.length?bar(n/l.length):''}
    <div class="mu">${l.map(g=>(isDone(d,g.id)?'✓ ':'· ')+esc(g.name)).join('<br>')}</div></div>`}).join('')},
progress(){
  const t=new Date(),day=i=>{const d=new Date(t);d.setDate(t.getDate()-i);return d},all=streak(d=>dayOk(d)),
    ci=[...Array(7)].filter((_,i)=>S.checkins[key(day(i))]).length,ins=insights(t),
    logs=new Set([...Object.keys(S.done).filter(k=>Object.values(S.done[k]||{}).some(Boolean)),...Object.keys(S.checkins),...Object.keys(S.values)]).size;
  const mon=day(wd(t)),wk=[...Array(8)].map((_,w)=>{const m=new Date(mon);m.setDate(mon.getDate()-(7-w)*7);let a=0,b=0;
    for(let i=0;i<7;i++){const d=new Date(m);d.setDate(m.getDate()+i);if(d>t)break;const l=scheduled(d);b+=l.length;a+=l.filter(g=>isDone(d,g.id)).length}
    return{m,p:b?a/b:null}}),wl=i=>wk[i].m.toLocaleDateString(undefined,{month:'numeric',day:'numeric'});
  const live=S.goals.filter(g=>!g.off),gl=live.map(g=>{let a=0,b=0;for(let i=0;i<28;i++){const d=day(i);const r=dayOk(d,g.id);if(r!=null&&(r||i)){b++;a+=r}}const p=b?a/b:null,s=streak(d=>dayOk(d,g.id)).cur;
    return `<div class="card"><b>${esc(g.name)}</b> <span class="mu">${esc(g.area)}</span><div class="mu">${p==null?'Not scheduled in the last 28 days':Math.round(p*100)+'% done, last 28 days'} · streak ${s} ${pl(s)}</div>${p==null?'':bar(p)}</div>`}).join('');
  const ck=[...Array(30)].map((_,i)=>S.checkins[key(day(29-i))]),cd=i=>md(day(29-i)),cn=ck.filter(Boolean),
    mo=[{n:'Mood',c:'s1',v:ck.map(c=>c?.mood??null)},{n:'Energy',c:'s2',v:ck.map(c=>c?.energy??null)}];
  const ug=live.filter(g=>g.unit),ms=ug.map(g=>{const ks=Object.keys(S.values).filter(k=>S.values[k][g.id]!=null).sort();if(ks.length<2)return '';
    const k0=new Date(ks[0]+'T12:00'),ix=k=>Math.round((new Date(k+'T12:00')-k0)/864e5),n=ix(ks.at(-1))+1,v=Array(n).fill(null),vs=ks.map(k=>S.values[k][g.id]);
    ks.forEach((k,j)=>v[ix(k)]=vs[j]);
    return `<div class="card"><b>${esc(g.name)}</b> <span class="mu">(${esc(g.unit)})</span>${lineChart(`${g.name} in ${g.unit}: ${ks.length} values, latest ${rnd(vs.at(-1))}, range ${rnd(Math.min(...vs))} to ${rnd(Math.max(...vs))}`,
      [{n:'',c:'s1',v}],n,nice(Math.min(...vs),Math.max(...vs)),i=>md(new Date(+k0+i*864e5)),1,40)}${tbl(['Date',g.unit],ks.map((k,j)=>[k,rnd(vs[j])]))}</div>`}).join('');
  return `<h1>Progress</h1><h2>Insights</h2>${ins.length?ins.map(x=>`<div class="card ins">${esc(x.text)}<div class="mu">${esc(x.detail)}</div></div>`).join('')
    +'<div class="mu">Patterns, not proof: they show what tends to go together in your logs.</div>'
    :`<div class="card mu">${logs<14?`You have ${logs} ${pl(logs)} of logs so far. Insights appear after about a week or two of regular logging.`:`You have ${logs} days of logs, but no clear pattern stands out right now. Keep logging and check back.`}</div>`}
  <h2>Overview</h2><div class="tiles">${tile('Current streak',all.cur,' '+pl(all.cur))}${tile('Best streak',all.best,' '+pl(all.best))}${tile('Check-ins, last 7 days',ci,' of 7')}</div>
  <h2>Weekly completion, last 8 weeks</h2><div class="card">${wk.some(w=>w.p!=null)?barChart('Weekly completion, last 8 weeks: '+wk.map((w,i)=>wl(i)+' '+(w.p==null?'none':Math.round(w.p*100)+'%')).join(', '),wk.map(w=>w.p),wl)
    +tbl(['Week of','Done'],wk.map((w,i)=>[wl(i),w.p==null?'nothing scheduled':Math.round(w.p*100)+'%'])):'<div class="mu">No goals were scheduled in the last 8 weeks. Add goals in the Goals tab.</div>'}</div>
  <h2>Goals, last 28 days</h2>${gl||'<div class="card mu">No goals yet. Add one in the Goals tab.</div>'}
  <h2>Mood & energy, last 30 days</h2><div class="card">${cn.length?`<div class="mu"><span class="k s1"></span>Mood<span class="k s2"></span>Energy</div>`
    +lineChart(`Mood and energy, last 30 days: ${cn.length} check-ins, latest mood ${cn.at(-1).mood}, energy ${cn.at(-1).energy}, on a 1 to 10 scale`,mo,30,[1,4,7,10],cd,0,60)
    +tbl(['Date','Mood','Energy'],ck.map((c,i)=>c&&[cd(i),c.mood,c.energy]).filter(Boolean)):'<div class="mu">No check-ins in the last 30 days. Save an evening check-in on the Today tab.</div>'}</div>
  <h2>Measures</h2>${ms||`<div class="card mu">${ug.length?'Log at least two values on the Today tab to see a chart.':'Add a measure to a goal (e.g. 30 m sprint, s) to chart it here.'}</div>`}
  <h2 id="mr">Monthly review</h2><div class="card"><div class="mu">${due(t)?'Your monthly review is ready.':'Look back at the last 28 days, compare them with the 28 before, and adjust your goals.'}</div>${START}</div>
  ${S.reviews.slice().reverse().map(r=>`<details class="card"><summary style="color:var(--tx);font-size:15px;margin:0">${esc(r.from)} to ${esc(r.to)} · ${r.pct==null?'nothing scheduled':esc(r.pct)+'% done'}</summary>
    <div class="mu">${r.prevPct==null?'Nothing scheduled':esc(r.prevPct)+'% done'} in the 28 days before</div>
    <div style="margin-top:6px">${(r.decisions||[]).map(d=>`${esc(d.name)}: <b>${esc(ACT[d.action]||d.action)}</b>`).join('<br>')}</div>
    ${[['worked','What worked'],['didnt',"What didn't"],['focus','Focus']].map(([k,l])=>r[k]?`<div style="margin-top:6px;white-space:pre-line"><span class="mu">${l}</span><br>${esc(r[k])}</div>`:'').join('')}</details>`).join('')}`},
review(){
  R=R||rev(new Date());const{c,p}=R,f=v=>v.toFixed(1),
    cmp=(l,k)=>c[k]==null?'':`<div>${l} <b>${f(c[k])}</b> <span class="mu">${p[k]==null?'':'vs '+f(p[k])+' before'}</span></div>`;
  return `<h1>Monthly review</h1><div class="mu">${R.lab}, compared with the 28 days before</div>
  <h2>Summary</h2><div class="tiles">${tile('Completion',c.pct==null?'–':c.pct+'%',c.pct!=null&&p.pct!=null?` vs ${p.pct}% (${c.pct>=p.pct?'+':''}${c.pct-p.pct})`:'')}${tile('Best streak',R.best,' '+pl(R.best))}${tile('Check-ins',c.ci,' of 28')}</div>
  ${c.mood!=null||c.energy!=null?`<div class="card">${cmp('Average mood','mood')}${cmp('Average energy','energy')}</div>`:''}
  ${R.ins.map(x=>`<div class="card ins" style="font-size:14px">${esc(x.text)}</div>`).join('')}
  <h2>Goals</h2>${R.g.map((x,i)=>`<div class="card"><b>${esc(x.g.name)}</b> <span class="mu">${esc(x.g.area)}</span>
    <div class="mu">${x.b?`${x.p}% done · ${x.b} scheduled ${pl(x.b)}`:'Not scheduled in this period'}${x.g.unit&&x.v.length?` · ${rnd(x.v[0])}${x.v.length>1?' → '+rnd(x.v[x.v.length-1]):''} ${esc(x.g.unit)}`:''}</div>${x.b?bar(x.p/100):''}
    <div style="font-size:14px;margin:8px 0 4px">Suggested: <b>${x.s[1]}</b>. ${x.s[2]}</div>
    <div class="chips" role="radiogroup" aria-label="Decision for ${esc(x.g.name)}">${Object.entries(ACT).map(([k,l])=>`<label><input type="radio" name="dec${i}" ${x.a==k?'checked':''} onchange="R.g[${i}].a='${k}';render();$('[name=dec${i}]:checked').focus()"><span>${l}</span></label>`).join('')}</div>
    ${x.a=='raise'||x.a=='lower'?`<div class="mu" style="margin-top:8px">${x.a=='raise'?'Pick more days, or change the name to a bigger version (e.g. Run 30 min).':'Pick fewer days, or change the name to a smaller version (e.g. Run 10 min).'}</div><input value="${esc(x.name)}" aria-label="Goal name" oninput="R.g[${i}].name=this.value">${dch(x.days,`R.g[${i}].days`)}`
      :x.a=='drop'?'<div class="mu" style="margin-top:8px">Removed from your goals when you save. Its history stays.</div>':''}</div>`).join('')||'<div class="card mu">No active goals to review.</div>'}
  <h2>Reflection</h2><div class="card">${[['worked','What worked this month?'],['didnt',"What didn't?"],['focus','One focus for next month']].map(([k,l])=>lb(l,`<textarea rows="3" oninput="R.${k}=this.value">${esc(R[k])}</textarea>`)).join('')}</div>
  <button onclick="saveReview()">Save review</button><button class="ghost" onclick="R=null;tab='progress';render();mr.scrollIntoView()">Cancel</button>`},
goals(){
  return `<h1>Goals</h1>`+(S.goals.filter(g=>!g.off).map(g=>`<div class="card">${E&&E.id==g.id?lb('Name',`<input value="${esc(E.name)}" oninput="E.name=this.value">`)
  +lb('Area',`<select onchange="E.area=this.value">${S.areas.map(a=>`<option ${a==E.area?'selected':''}>${esc(a)}</option>`).join('')}</select>`)
  +`<span class="mu">Days</span>${dch(E.days,'E.days')}`+lb('Measure (optional)',`<input value="${esc(E.unit)}" placeholder="e.g. 30 m sprint, s" oninput="E.unit=this.value">`)
  +lb('Why it matters (optional)',`<input value="${esc(E.why)}" oninput="E.why=this.value">`)
  +`<div style="display:flex;gap:8px"><button onclick="saveEdit()">Save</button><button class="ghost" onclick="E=null;render()">Cancel</button></div>`
  :`<b>${esc(g.name)}</b> <span class="mu">${esc(g.area)}</span><br>
  <span class="mu">${g.days.map(i=>DAYS[i]).join(' ')}${g.unit?' · '+esc(g.unit):''}${g.why?' · '+esc(g.why):''}</span>
  <div style="display:flex;gap:8px"><button class="ghost" onclick="edit('${g.id}')">Edit</button><button class="ghost" onclick="del('${g.id}')">Delete</button></div>`}</div>`).join('')||'<div class="card mu">No goals yet.</div>')+
  `<h2>Add a goal</h2><div class="card"><input id="gn" placeholder="Action, e.g. Run 20 min">
  <select id="ga">${S.areas.map(a=>`<option>${esc(a)}</option>`).join('')}</select>
  <input id="gw" placeholder="Why it matters (optional)"><input id="gu" placeholder="Measure (e.g. 30 m sprint, s), optional">
  <div class="chips">${DAYS.map((d,i)=>`<label><input type="checkbox" value="${i}" class="gd"><span>${d}</span></label>`).join('')}</div>
  <button onclick="addGoal()">Add goal</button></div>`},
settings(){
  const r=S.reminder;
  return `<h1>Settings</h1><h2>Areas</h2><div class="card">
  ${S.areas.map((a,i)=>`<div class="row" style="display:flex;justify-content:space-between">${esc(a)}<a onclick="delArea(S.areas[${i}])" class="mu">remove</a></div>`).join('')}
  <input id="na" placeholder="New area, e.g. Money"><button onclick="addArea()">Add area</button></div>
  <h2>Daily reminder</h2><div class="card"><label class="row"><input type="checkbox" ${r.on?'checked':''} onchange="remind(this.checked)">Remind me daily</label>
  <input type="time" value="${r.time}" onchange="S.reminder.time=this.value;save()">
  <div class="mu">Fires only while the app is open or running in the background; a closed phone app may miss it.</div></div>`}};

function render(){
  $('#app').innerHTML=views[tab]();
  $('#nav').innerHTML=[['today','Today'],['week','Week'],['progress','Progress'],['goals','Goals'],['settings','Settings']]
    .map(([k,l])=>`<button class="${k==tab?'on':''}" onclick="tab='${k}';render()">${l}</button>`).join('')}
function tog(id){const k=key(new Date());(S.done[k]=S.done[k]||{})[id]=!S.done[k][id];save();render()}
function checkin(){S.checkins[key(new Date())]={mood:+mood.value,energy:+energy.value,win:win.value,fix:fix.value};save();render()}
function addGoal(){const name=gn.value.trim(),days=[...document.querySelectorAll('.gd:checked')].map(e=>+e.value);
  if(!name||!days.length)return alert('Give it a name and pick at least one day.');
  S.goals.push({id:Date.now().toString(36),name,area:ga.value,why:gw.value.trim(),unit:gu.value.trim(),days});save();render()}
function logv(id,el){if(el.validity.badInput)return alert('Use a dot for decimals, e.g. 4.5');const v=el.value,k=key(new Date()),o=S.values[k]=S.values[k]||{};if(v==='')delete o[id];else o[id]=+v;if(!Object.keys(o).length)delete S.values[k];save()}
function del(id,ok){if(ok||confirm('Delete this goal?')){S.goals.find(g=>g.id==id).off=Date.now();save();render()}}
// partial update, same validation as addGoal; a days change files the old days in g.dh so the days before today keep their stats
function editGoal(id,o){const g=S.goals.find(g=>g.id==id),n={...g,...o};if(!g||!okG(n))return false;
  for(const f of['name','why','unit'])if(typeof n[f]=='string')n[f]=n[f].trim();
  if(''+n.days!=''+g.days)n.dh=[...g.dh||[],[Date.now(),g.days]];Object.assign(g,n);save();return true}
function edit(id){const g=S.goals.find(g=>g.id==id);E={id,name:g.name,area:g.area,why:g.why||'',unit:g.unit||'',days:[...g.days]};render()}
function saveEdit(){if(!editGoal(E.id,E))return alert('Give it a name and pick at least one day.');E=null;render()}
function tgd(a,i){const j=a.indexOf(i);j<0?a.push(i):a.splice(j,1);a.sort()}
// nothing touches S until every raise/lower edit is valid; Cancel just drops R
function saveReview(){const ed=R.g.filter(x=>x.a=='raise'||x.a=='lower'),t=k=>R[k].trim(),focus=t('focus');
  if(!ed.every(okG))return alert('Each goal you raise or lower needs a name and at least one day.');
  ed.forEach(x=>editGoal(x.g.id,{name:x.name,days:x.days}));R.g.forEach(x=>x.a=='drop'&&del(x.g.id,1));
  S.reviews.push({at:R.at,from:R.from,to:R.to,pct:R.c.pct,prevPct:R.p.pct,mood:R.c.mood,prevMood:R.p.mood,energy:R.c.energy,prevEnergy:R.p.energy,
    decisions:R.g.map(x=>({id:x.g.id,name:x.g.name,action:x.a})),worked:t('worked'),didnt:t('didnt'),focus});
  S.focus=focus;R=E=null;tab='progress';save();render();mr.scrollIntoView()} // E: a stale Goals edit form would undo these decisions
function addArea(){const a=na.value.trim();if(a&&!S.areas.includes(a)){S.areas.push(a);save();render()}}
function delArea(a){if(S.goals.some(g=>!g.off&&g.area==a))return alert('Move or delete that area\'s goals first.');S.areas=S.areas.filter(x=>x!=a);save();render()}
async function remind(on){if(on&&await Notification.requestPermission()!='granted'){alert('Notifications are blocked in your browser.');on=false}S.reminder.on=on;save();render()}
setInterval(()=>{const r=S.reminder,n=new Date(),k=key(n);
  if(r.on&&r.last!=k&&n.toTimeString().slice(0,5)>=r.time){r.last=k;save();
    navigator.serviceWorker.ready.then(s=>s.showNotification('Self Improve',{body:'Time for your check-in.'}))}},30000);
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{});
  if(navigator.serviceWorker.controller)navigator.serviceWorker.addEventListener('controllerchange',()=>location.reload())}
render();
</script></body></html>
