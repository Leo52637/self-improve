<script>
const DAYS=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
let S;try{S=JSON.parse(localStorage.getItem('si'))}catch(e){}
S=S||{areas:['Body','Mind','Skills'],goals:[],done:{},checkins:{},reminder:{on:false,time:'20:00',last:''}};for(const k of['done','checkins','values'])S[k]=S[k]||{};if(!Array.isArray(S.reviews))S.reviews=[];
const save=()=>localStorage.setItem('si',JSON.stringify(S));
const key=d=>new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
const wd=d=>(d.getDay()+6)%7;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let tab='today',R=null,E=null,P=null,J=null,PS;const $=s=>document.querySelector(s); // R = monthly review draft, E = goal being edited, P = backup awaiting Restore/Cancel, J = goal just ticked (animates once), PS = storage persisted?
const TDF=new Intl.DateTimeFormat(undefined,{weekday:'long',day:'numeric',month:'long'}),STAR='M256 110l40 120h120l-98 72 38 118-100-74-100 74 38-118-98-72h120z';
const bar=p=>`<div class="bar"><i style="width:${Math.round(p*100)}%"></i></div>`,pl=n=>n==1?'day':'days',
  tile=(l,v,u)=>`<div class="card tile"><div class="mu">${l}</div><b>${v}</b><span class="mu">${u}</span></div>`;
// days in effect on d: g.dh=[[changedAt ms, old days],...] oldest first; a change counts from its own day on, so earlier days keep the old schedule
const D0=new WeakMap(),d0=e=>D0.get(e)??D0.set(e,new Date(e[0]).setHours(0,0,0,0)).get(e); // change-day midnight, cached: stats call daysOn ~100k times
const daysOn=(g,d)=>(g.dh||[]).find(e=>d<d0(e))?.[1]||g.days;
// a goal only counts from the day it was created (id = creation time in base 36; NaN ids stay included) until the day it was deleted (off)
const scheduled=d=>{const e=new Date(d);e.setHours(23,59,59,999);return S.goals.filter(g=>daysOn(g,d).includes(wd(d))&&!(parseInt(g.id,36)>e)&&!(g.off<=e))};
const isDone=(d,id)=>!!(S.done[key(d)]||{})[id];
const dayOk=(d,id)=>{const l=scheduled(d).filter(g=>!id||g.id==id);return l.length?l.every(g=>isDone(d,g.id)):null};
// f(d): true=complete, false=missed, null=nothing scheduled (skipped); an unfinished today never breaks the run
function streak(f,n=400,t=new Date()){let cur=0,best=0,pb=0,run=0,live=true;const d=new Date(t);
  for(let i=0;i<n;i++,d.setDate(d.getDate()-1)){const r=f(d);if(r==null||(!r&&!i))continue;
    if(r){run++;best=Math.max(best,run);if(!live)pb=Math.max(pb,run)}else{run=0;live=false}if(live)cur=run}
  return{cur,best,pb}} // pb = best of the earlier runs, so a tie is not a new best
// insights: patterns in the user's own logs, computed locally. Gaps/rates are fractions of 1, mood/energy on 1-10, valPct in %
const TH={n:5,moodDiff:1,wkN:3,wkGap:.3,hist:14,trend:.1,trendN:5,enN:4,lowE:4,hiE:7,enGap:.2,weak:.5,weakN:6,wordN:3,wordShare:.3,valN:4,valPct:2,streak:3,max:6};
// words of 4+ letters only, so shorter stopwords need no entry; Spanish too since notes may be in Spanish
const STOP=new Set(('that this with have from they them then than were been what when where which while will would could should there their about into more most some just like very also only over much many really again always never still here wasn didnt haven isnt went does '+
  'today tomorrow yesterday didn doesn dont cant wont because after before being each even ever every going make made need other same such through want well your yours mine myself these those doing done feel felt thing things something nothing enough good better '+
  'para pero como cómo dónde cuándo está entonces puede hace nadie pues todavía todavia esos esas esta este esto estos estas sobre entre cuando donde porque todo todos toda todas mucho mucha muchos muchas poco poca algo nada tambien también desde hasta hacer hice hizo tengo tiene tener tuve estoy estar estaba estuve había habia hemos sido siempre nunca '+
  'otra otro otros otras ahora antes después despues luego bien solo sólo cada mismo misma aunque mientras según contra durante ellos ellas nosotros usted ustedes quiero puedo pude mañana manana ayer cosa cosas menos mejor demasiado bastante están estan eran eres somos será sera aquí aqui allí alli').split(' '));
const WDS=['Mondays','Tuesdays','Wednesdays','Thursdays','Fridays','Saturdays','Sundays'];
function insights(now){
  const out=[],add=(score,text,detail)=>out.push({text,detail,score}),gte=(x,t)=>x>t-1e-9,
    p=x=>Math.round(x*100)+'%',f1=x=>x.toFixed(1),q=s=>`'${s}'`,nm=v=>v>0?+v:null,avg=a=>a.reduce((s,x)=>s+x,0)/a.length,
    // days[i] = i days before now (0 = today); built once, every insight reads from it
    days=[...Array(62)].map((_,i)=>{const d=new Date(now);d.setDate(now.getDate()-i);const k=key(d),l=scheduled(d),dn=S.done[k]||{};
      return{d,k,l,dn,c:S.checkins[k]||{},a:l.filter(g=>dn[g.id]).length}}),
    rng=(a,b)=>days.slice(a,b+1),last60=rng(1,60),live=S.goals.filter(g=>!g.off);
  // a. mood/energy on all-done days vs the rest
  for(const f of['mood','energy']){const y=[],n=[];last60.forEach(x=>{const v=nm(x.c[f]);if(x.l.length&&v!=null)(x.a==x.l.length?y:n).push(v)});
    const a=avg(y),b=avg(n);if(y.length>=TH.n&&n.length>=TH.n&&gte(Math.abs(a-b),TH.moodDiff))
      add(Math.abs(a-b)*15,`Your ${f} averages ${f1(a)} on days you finish all your goals vs ${f1(b)} on days you don't.`,`Based on ${y.length} days with everything done and ${n.length} without, last 60 days.`)}
  // b. mood when one goal is done vs missed; skipped when it only mirrors (a): same split (own==0) over the same days (mc)
  const mc=last60.filter(x=>x.l.length&&nm(x.c.mood)!=null).length;
  live.map(g=>{const y=[],n=[];let own=0;last60.forEach(x=>{const v=nm(x.c.mood);if(v==null||!x.l.includes(g))return;const ok=!!x.dn[g.id];(ok?y:n).push(v);own+=ok!=(x.a==x.l.length)});
    return{g,a:avg(y),b:avg(n),y:y.length,n:n.length,own}}).filter(r=>(r.own||r.y+r.n<mc)&&r.y>=TH.n&&r.n>=TH.n&&gte(Math.abs(r.a-r.b),TH.moodDiff))
    .sort((r,s)=>Math.abs(s.a-s.b)-Math.abs(r.a-r.b)).slice(0,2)
    .forEach(r=>add(Math.abs(r.a-r.b)*13,`Your mood is ${r.a>r.b?'higher':'lower'} on days you do ${q(r.g.name)}: ${f1(r.a)} vs ${f1(r.b)} when you miss it.`,`Based on ${r.y} days done and ${r.n} missed, last 60 days.`));
  // c. weakest weekday per goal, last 8 weeks up to yesterday; must be the single worst day. f. struggling goal, last 28 days (today once done, like the goal card)
  live.forEach(g=>{const n=Array(7).fill(0),a=Array(7).fill(0);let fa=0,fb=0;
    rng(0,56).forEach((x,i)=>{if(!x.l.includes(g))return;const ok=!!x.dn[g.id];if(i<28&&(ok||i)){fb++;fa+=ok}if(i){const w=wd(x.d);n[w]++;a[w]+=ok}});
    const N=n.reduce((s,v)=>s+v),A=a.reduce((s,v)=>s+v);let w=-1;n.forEach((v,i)=>{if(v&&(w<0||a[i]/v<a[w]/n[w]))w=i});
    if(w>=0&&n[w]>=TH.wkN&&N-n[w]>=TH.wkN&&!n.some((v,i)=>i!=w&&v&&a[i]*n[w]==a[w]*v)){const r=a[w]/n[w],o=(A-a[w])/(N-n[w]);if(gte(o-r,TH.wkGap))
      add((o-r)*50,`You miss ${q(g.name)} most on ${WDS[w]} (done ${a[w]} of ${n[w]}) vs ${p(o)} on other days.`,`Based on ${N} scheduled days, last 8 weeks.`)}
    if(fb>=TH.weakN&&fa/fb<TH.weak)add((TH.weak-fa/fb)*60+10,`You're getting ${q(g.name)} done ${p(fa/fb)} of the time. Try scheduling it on fewer days or making it smaller.`,`${fa} of ${fb} scheduled days done, last 28 days.`)});
  // d. last 7 days vs the 28 before; hist = oldest day (within 35) that had anything scheduled
  const tot=l=>l.reduce((s,x)=>({a:s.a+x.a,b:s.b+x.l.length}),{a:0,b:0}),w1=tot(rng(1,7)),w4=tot(rng(8,35)),hist=rng(1,35).map(x=>!!x.l.length).lastIndexOf(true)+1;
  if(hist>=TH.hist&&w1.b>=TH.trendN&&w4.b>=TH.trendN){const r1=w1.a/w1.b,r4=w4.a/w4.b;if(gte(Math.abs(r1-r4),TH.trend))
    add(Math.abs(r1-r4)*100,r1>r4?`You're on a roll: ${p(r1)} of your goals done in the last 7 days, up from ${p(r4)} before that.`:`Your completion slipped to ${p(r1)} in the last 7 days, down from ${p(r4)} before that.`,
      `${w1.a} of ${w1.b} done in the last 7 days vs ${w4.a} of ${w4.b} in the weeks before.`)}
  // e. completion the day after a low- vs high-energy check-in
  const lo={n:0,a:0,b:0},hi={n:0,a:0,b:0};
  for(let i=1;i<=60;i++){const x=days[i],e=nm(days[i+1].c.energy),g=!x.l.length||e==null?0:e<=TH.lowE?lo:e>=TH.hiE?hi:0;if(g){g.n++;g.a+=x.a;g.b+=x.l.length}}
  if(lo.n>=TH.enN&&hi.n>=TH.enN&&gte(hi.a/hi.b-lo.a/lo.b,TH.enGap))add((hi.a/hi.b-lo.a/lo.b)*60,
    `After a low-energy evening (${TH.lowE} or less) you get ${p(lo.a/lo.b)} of the next day's goals done, vs ${p(hi.a/hi.b)} after a high-energy one (${TH.hiE}+).`,`Based on ${lo.n} days after low energy and ${hi.n} after high, last 60 days.`);
  // g. recurring words in the last 30 check-ins' notes, each note counted once
  const ck=Object.keys(S.checkins).filter(k=>k<=days[0].k).sort().slice(-30).map(k=>S.checkins[k]||{});
  for(const[f,lab]of[['fix','things to fix'],['win','wins']]){const ns=ck.map(c=>c[f]).filter(s=>typeof s=='string'&&s.trim()),m=new Map();
    ns.forEach(s=>new Set(s.toLowerCase().match(/\p{L}+/gu)).forEach(w=>{if(w.length>=4&&!STOP.has(w))m.set(w,(m.get(w)||0)+1)}));
    const[w,c]=[...m].sort((a,b)=>b[1]-a[1])[0]||[];
    if(c>=TH.wordN&&c/ns.length>=TH.wordShare)add(c/ns.length*40,`'${w}' came up in ${c} of your last ${ns.length} ${lab}.`,`Based on ${ns.length} notes in your last ${ck.length} check-ins.`)}
  // h. measure trend, first vs last value plus least-squares slope, only when both agree; neutral since lower can be better
  live.filter(g=>g.unit).forEach(g=>{const pts=rng(0,59).map((x,i)=>[-i,S.values[x.k]?.[g.id]]).filter(([,v])=>typeof v=='number'&&isFinite(v)).reverse();
    if(pts.length<TH.valN||!pts[0][1])return;const[t0,v0]=pts[0],[t1,v1]=pts[pts.length-1],ch=(v1-v0)/Math.abs(v0)*100;
    const mx=avg(pts.map(x=>x[0])),my=avg(pts.map(x=>x[1])),sl=7*pts.reduce((s,[x,y])=>s+(x-mx)*(y-my),0)/pts.reduce((s,[x])=>s+(x-mx)**2,0),sp=t1-t0,
      dp=Math.max(...[v0,v1].map(v=>(String(rnd(v)).split('.')[1]||'').length));
    if(!gte(Math.abs(ch),TH.valPct)||sl*ch<=0)return;
    add(Math.min(30,8+Math.abs(ch)*1.5),`Your ${q(g.name)} (${g.unit}) went from ${rnd(v0).toFixed(dp)} to ${rnd(v1).toFixed(dp)} over ${sp>=14?Math.round(sp/7)+' weeks':sp+' days'} (${ch>0?'+':''}${ch.toFixed(1)}%).`,
      `Based on ${pts.length} values in the last 60 days; trend ${sl>0?'+':''}${rnd(sl)} per week.`)});
  // i. streak at or one day short of its best
  const s=streak(d=>dayOk(d),400,now);
  if(s.cur>=TH.streak&&s.cur>=s.best-1)add(s.cur==s.best?20:16,s.cur==s.best?`You're on a streak of ${s.cur} days, ${s.cur>s.pb?'your best yet':'matching your best'}. Keep it going!`:`You're on a streak of ${s.cur} days, one day short of your best (${s.best}).`,
    `Days in a row with every scheduled goal done; rest days don't break it.`);
  return out.sort((a,b)=>b.score-a.score).slice(0,TH.max)}
const W=300,H=150,T=18,B=22,L=30,rnd=v=>Math.round(v*100)/100,MDF=new Intl.DateTimeFormat(undefined,{month:'short',day:'numeric'}),md=d=>MDF.format(d);
const svg=(lab,o)=>`<svg class="viz" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(lab)}">${o}</svg>`;
const grid=(ticks,sy,x2,f)=>ticks.map(t=>`<line x1="${L}" x2="${x2}" y1="${sy(t)}" y2="${sy(t)}"/><text x="${L-4}" y="${sy(t)+3}" text-anchor="end">${f(t)}</text>`).join('');
const tbl=(h,rows)=>`<details><summary>Show data table</summary><table><tr>${h.map(x=>`<th>${esc(x)}</th>`).join('')}</tr>${rows.map(r=>`<tr>${r.map(x=>`<td>${esc(x)}</td>`).join('')}</tr>`).join('')}</table></details>`;
const nice=(a,b)=>{if(a==b){a--;b++}const r=(b-a)/3,p=10**Math.floor(Math.log10(r)),s=[1,2,5,10].find(m=>m*p>=r)*p,t=[];
  for(let v=Math.floor(a/s)*s;v<Math.ceil(b/s)*s+s/2;v+=s)t.push(+v.toPrecision(12));return t};
// vals: 0..1 or null per week; value label only on the latest bar, the rest live in tooltip + table
function barChart(lab,vals,xl){const n=vals.length,pw=W-L-8,band=pw/n,bw=14,sy=v=>T+(1-v)*(H-T-B);
  return svg(lab,grid([0,.5,1],sy,W-8,t=>t*100+'%')+vals.map((v,i)=>{const x=L+i*band+(band-bw)/2,y=sy(v||0),r=Math.min(4,H-B-y);
    return `<g class="hit"><rect x="${L+i*band}" y="${T}" width="${band}" height="${H-T-B}"/>${v?`<path class="br" d="M${x},${H-B}V${y+r}Q${x},${y} ${x+r},${y}H${x+bw-r}Q${x+bw},${y} ${x+bw},${y+r}V${H-B}Z"/>`:''}
    ${i==n-1&&v!=null?`<text class="vl" x="${x+bw/2}" y="${y-4}" text-anchor="middle">${Math.round(v*100)}%</text>`:''}<text x="${x+bw/2}" y="${H-6}" text-anchor="middle">${esc(xl(i))}</text>

  <h2>Theme</h2><div class="card"><div class="chips" role="radiogroup" aria-label="Theme">${[['','System'],['light','Light'],['dark','Dark']].map(([k,l])=>`<label><input type="radio" name="th" ${(S.theme||'')==k?'checked':''} onchange="theme('${k}')"><span>${l}</span></label>`).join('')}</div></div>
  <h2>Areas</h2><div class="card">
  ${S.areas.map((a,i)=>`<div class="row" style="display:flex;justify-content:space-between">${esc(a)}<a onclick="delArea(S.areas[${i}])" class="mu">remove</a></div>`).join('')}
  <input id="na" placeholder="New area, e.g. Money"><button onclick="addArea()">Add area</button></div>
  <h2>Daily reminder</h2><div class="card"><label class="row"><input type="checkbox" ${r.on?'checked':''} onchange="remind(this.checked)">Remind me daily</label>
  <input type="time" value="${r.time}" onchange="S.reminder.time=this.value;save()">
  <div class="mu">Fires only while the app is open or running in the background; a closed phone app may miss it.</div></div>`}};

function render(){const c=tab=='review'?'progress':tab; // the review belongs to Progress (its history and Start button live there)

  $('#nav').innerHTML=NAV.map(([k,l,p])=>`<button class="${k==c?'on':''}"${k==c?' aria-current="page"':''} onclick="tab='${k}';render();window.scrollTo(0,0)"><svg viewBox="0 0 24 24" aria-hidden="true">${p}</svg>${l}</button>`).join('')}
function tog(id){const k=key(new Date());(S.done[k]=S.done[k]||{})[id]=!S.done[k][id];save();J=S.done[k][id]&&id;render();J=null}
function checkin(){S.checkins[key(new Date())]={mood:+mood.value,energy:+energy.value,win:win.value,fix:fix.value};save();render()}
function addGoal(){const name=gn.value.trim(),days=[...document.querySelectorAll('.gd:checked')].map(e=>+e.value);
  if(!name||!days.length)return alert('Give it a name and pick at least one day.');
  S.goals.push({id:Date.now().toString(36),name,area:ga.value,why:gw.value.trim(),unit:gu.value.trim(),days});save();render()}
function logv(id,el){if(el.validity.badInput)return alert('Use a dot for decimals, e.g. 4.5');const v=el.value,k=key(new Date()),o=S.values[k]=S.values[k]||{};if(v==='')delete o[id];else o[id]=+v;if(!Object.keys(o).length)delete S.values[k];save()}
function del(id,ok){if(ok||confirm('Delete this goal?')){S.goals.find(g=>g.id==id).off=Date.now();save();render()}}
// partial update, same validation as addGoal; a days change files the old days in g.dh so the days before today keep their stats
function editGoal(id,o){const g=S.goals.find(g=>g.id==id),n={...g,...o};if(!g||!okG(n))return false;
  for(const f of['name','why','unit'])if(typeof n[f]=='string')n[f]=n[f].trim();
  if(''+n.days!=''+g.days)n.dh=[...g.dh||[],[Date.now(),g.days]];Object.assign(g,n);save();return true}
function edit(id){const g=S.goals.find(g=>g.id==id);E={id,name:g.name,area:g.area,why:g.why||'',unit:g.unit||'',days:[...g.days]};render()}
function saveEdit(){if(!editGoal(E.id,E))return alert('Give it a name and pick at least one day.');E=null;render()}
function tgd(a,i){const j=a.indexOf(i);j<0?a.push(i):a.splice(j,1);a.sort()}
// nothing touches S until every raise/lower edit is valid; Cancel just drops R
function saveReview(){const ed=R.g.filter(x=>x.a=='raise'||x.a=='lower'),t=k=>R[k].trim(),focus=t('focus');
  if(!ed.every(okG))return alert('Each goal you raise or lower needs a name and at least one day.');
  ed.forEach(x=>editGoal(x.g.id,{name:x.name,days:x.days}));R.g.forEach(x=>x.a=='drop'&&del(x.g.id,1));
  S.reviews.push({at:R.at,from:R.from,to:R.to,pct:R.c.pct,prevPct:R.p.pct,mood:R.c.mood,prevMood:R.p.mood,energy:R.c.energy,prevEnergy:R.p.energy,
    decisions:R.g.map(x=>({id:x.g.id,name:x.g.name,action:x.a})),worked:t('worked'),didnt:t('didnt'),focus});
  S.focus=focus;R=E=null;tab='progress';save();render();mr.scrollIntoView()} // E: a stale Goals edit form would undo these decisions
function addArea(){const a=na.value.trim();if(a&&!S.areas.includes(a)){S.areas.push(a);save();render()}}
function delArea(a){if(S.goals.some(g=>!g.off&&g.area==a))return alert('Move or delete that area\'s goals first.');S.areas=S.areas.filter(x=>x!=a);save();render()}
async function remind(on){if(on&&await Notification.requestPermission()!='granted'){alert('Notifications are blocked in your browser.');on=false}S.reminder.on=on;save();render()}
function theme(t){t?S.theme=t:delete S.theme;save();th(t);render();$('[name=th]:checked')?.focus()}
// backup = all of S as a JSON file; phones get the share sheet (Save to Files, Drive...), desktops a download
async function backup(){const d=new Date(),n=`self-improve-backup-${key(d)}.json`,
  f=new File([JSON.stringify({app:'self-improve',version:1,exportedAt:d.toISOString(),data:S})],n,{type:'application/json'}),
  dl=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(f);a.download=n;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),6e4)};
  // touch devices only (desktop share sheets can't save a file); Chromium says canShare yet rejects .json with NotAllowedError, so any error but a cancel downloads
  if(matchMedia('(pointer:coarse)').matches&&navigator.canShare?.({files:[f]})){try{await navigator.share({files:[f]})}catch(e){if(e.name=='AbortError')return;dl()}} // cancelled: no backup was made
  else dl();
  S.lastBackup=Date.now();save();render()}
// restore is a trust boundary: the new S is rebuilt from checked fields only, so unknown keys, wrong types and names like __proto__ never get in.
// Top-level fields and goals with the wrong shape reject the file; malformed entries inside the logs are dropped, impossible dates too (Progress turns date gaps into array lengths).
const ID=/^[\w-]{1,40}$/,DK={test:k=>{const d=new Date(k+'T12:00');return /^\d{4}-\d\d-\d\d$/.test(k)&&!isNaN(d)&&key(d)==k}},isO=x=>!!x&&typeof x=='object'&&!Array.isArray(x),str=x=>typeof x=='string',num=x=>typeof x=='number'&&isFinite(x),
  nn=(n,w)=>`${n} ${w}${n==1?'':'s'}`,XDF=new Intl.DateTimeFormat(undefined,{day:'numeric',month:'short',year:'numeric'}),
  // fresh object with the keys that pass kr and the values f returns; k in r skips inherited names (__proto__, constructor, toString...)
  dict=(x,kr,f)=>{if(!isO(x))return;const r={};for(const[k,v]of Object.entries(x)){const w=kr.test(k)&&!(k in r)?f(v):undefined;if(w!==undefined)r[k]=w}return r},
  fl=(x,ns,ss)=>{const r={};ns.forEach(f=>{if(num(x[f])||x[f]===null)r[f]=x[f]});ss.forEach(f=>{if(str(x[f]))r[f]=x[f]});return r};
function readBackup(txt){
  const no=m=>{throw Error(m)},ok=x=>x||no('That backup file is damaged or incomplete, so nothing was changed.');let o;
  try{o=JSON.parse(txt)}catch(e){no("That file isn't a backup: it isn't valid JSON.")}
  if(!isO(o)||o.app!=='self-improve')no("That file isn't a Self Improve backup.");
  if(o.version!==1)no('That backup was made by a newer version of the app. Update the app and try again.');
  const d=ok(isO(o.data)&&o.data),at=ok(str(o.exportedAt)&&Date.parse(o.exportedAt)),days=a=>ok(Array.isArray(a)&&a.every(x=>Number.isInteger(x)&&x>=0&&x<7))&&[...new Set(a)].sort();
  const goals=ok(Array.isArray(d.goals)&&d.goals).map(g=>{ok(isO(g)&&str(g.id)&&ID.test(g.id)&&!(g.id in{})&&str(g.name)&&g.name.trim()); // ids go into onclick handlers
    const n={...fl(g,[],['id','name','area','why','unit']),days:days(g.days)};if(num(g.off))n.off=g.off;
    if(g.dh!=null)n.dh=ok(Array.isArray(g.dh)&&g.dh).map(e=>ok(Array.isArray(e)&&num(e[0]))&&[e[0],days(e[1])]).sort((a,b)=>a[0]-b[0]);return n});
  ok(new Set(goals.map(g=>g.id)).size==goals.length);
  const data={areas:ok(Array.isArray(d.areas)&&d.areas).filter(str),goals,
    done:ok(dict(d.done,DK,v=>dict(v,ID,b=>typeof b=='boolean'?b:undefined))),
    checkins:ok(dict(d.checkins,DK,c=>isO(c)?fl(c,['mood','energy'],['win','fix']):undefined)),
    values:ok(dict(d.values,DK,v=>dict(v,ID,x=>num(x)?x:undefined))),
    reviews:ok(Array.isArray(d.reviews)&&d.reviews).filter(isO).map(r=>({...fl(r,['at','pct','prevPct','mood','prevMood','energy','prevEnergy'],['from','to','worked','didnt','focus']),
      decisions:(Array.isArray(r.decisions)?r.decisions:[]).filter(isO).map(x=>({...fl(x,[],['id','name']),action:Object.hasOwn(ACT,x.action)?x.action:'keep'}))})),
    reminder:S.reminder,lastBackup:at}; // the reminder stays this device's own: it needs this device's notification permission
  if(str(d.focus))data.focus=d.focus;if(d.theme=='light'||d.theme=='dark')data.theme=d.theme;
  return{data,sum:`${nn(goals.filter(g=>!g.off).length,'goal')}, ${nn(nlogs(data),'day')} of logs, ${nn(data.reviews.length,'review')}, exported ${XDF.format(at)}. This replaces what's on this device now.`}}
async function pick(el){const f=el.files[0];el.value='';if(!f)return;
  if(f.size>5*2**20)return alert('That file is too big to be a Self Improve backup (over 5 MB), so nothing was changed.');
  try{P=readBackup(await f.text());render()}catch(e){alert(e.message)}}
// the data from before is kept in 'si-before-restore' until Undo restore or the next restore; with storage full nothing changes (an earlier copy is put back)
function restore(){const o=localStorage.getItem('si-before-restore');try{localStorage.setItem('si-before-restore',JSON.stringify(S));localStorage.setItem('si',JSON.stringify(P.data))}
  catch(e){try{o==null?localStorage.removeItem('si-before-restore'):localStorage.setItem('si-before-restore',o)}catch(e){}return alert("Couldn't restore: this device is out of storage space. Nothing was changed.")}
  S=P.data;P=R=E=null;th(S.theme);render()}
function undo(){const o=localStorage.getItem('si-before-restore');if(o==null||!confirm('Go back to your data from before the restore? Anything you logged since then will be lost.'))return;
  try{localStorage.setItem('si',o)}catch(e){return alert("Couldn't undo: this device is out of storage space. Nothing was changed.")}
  localStorage.removeItem('si-before-restore');S=JSON.parse(o);P=R=E=null;th(S.theme);render()}
setInterval(()=>{const r=S.reminder,n=new Date(),k=key(n);
  if(r.on&&r.last!=k&&n.toTimeString().slice(0,5)>=r.time){r.last=k;save();
    navigator.serviceWorker.ready.then(s=>s.showNotification('Self Improve',{body:'Time for your check-in.'}))}},30000);
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{});
  if(navigator.serviceWorker.controller)navigator.serviceWorker.addEventListener('controllerchange',()=>location.reload())}
// once per launch: ask to be exempt from storage eviction; PS stays undefined where the browser can't tell
(async()=>{try{await navigator.storage.persist?.();PS=await navigator.storage.persisted?.();if(tab=='settings')render()}catch(e){}})();
render();
